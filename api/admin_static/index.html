<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Admin dashboard for Free Claude Code configuration and management." />
    <title>Free Claude Code Admin</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Left Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo-wrapper">
            <div class="logo-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
                <line x1="12" y1="22" x2="12" y2="15.5"/>
                <polyline points="22 8.5 12 15.5 2 8.5"/>
                <polyline points="2 15.5 12 8.5 22 15.5"/>
                <line x1="12" y1="2" x2="12" y2="8.5"/>
              </svg>
            </div>
            <h1 class="logo-text">FCC</h1>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <div class="nav-section-label">Navigation</div>
            <div class="nav-list">
              <button class="nav-item active" data-view="dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
              </button>
              <button class="nav-item" data-view="providers">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4"/><path d="M12 19v4"/><path d="M1 12h4"/><path d="M19 12h4"/></svg>
                <span>Providers</span>
              </button>
              <button class="nav-item" data-view="model_config">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
                <span>Model Config</span>
              </button>
              <button class="nav-item" data-view="messaging">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Messaging</span>
              </button>
            </div>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="status-card">
            <div class="status-indicator connected">
              <span class="status-dot"></span>
              <div class="status-content">
                <span class="status-label">Server Status</span>
                <span class="status-text">Online</span>
              </div>
            </div>
          </div>
          <div class="version-card">
            <span class="version-text">v1.4.0</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <!-- Top Bar -->
        <header class="topbar">
          <div class="topbar-left">
            <h2 class="page-title" id="pageTitle">Dashboard</h2>
          </div>
          <div class="topbar-right">
            <div class="dirty-indicator" id="dirtyState">
              <span class="dot"></span>
              <span class="text">No changes</span>
            </div>
          </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">Total Tokens</span>
            <span class="stat-value" id="totalTokens">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Requests</span>
            <span class="stat-value" id="totalRequests">-</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Active Providers</span>
            <span class="stat-value" id="activeProviders">-</span>
          </div>
        </div>
        <header class="topbar">
          <div class="topbar-left">
            <h2 class="page-title" id="pageTitle">Dashboard</h2>
          </div>
          <div class="topbar-right">
            <div class="dirty-indicator" id="dirtyState">
              <span class="dot"></span>
              <span class="text">No changes</span>
            </div>
          </div>
        </header>

        <!-- Views -->
        <div class="admin-views" id="adminViews">
          <!-- Dashboard View -->
          <section id="view-dashboard" class="admin-view active" data-view="dashboard">
            <div class="dashboard-grid">
              <div class="dashboard-card">
                <div class="card-header">
                  <h3>Provider Health</h3>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <div class="card-content" id="providerHealthChart">
                  <div class="empty-state">Loading...</div>
                </div>
              </div>

              <div class="dashboard-card">
                <div class="card-header">
                  <h3>Token Usage (24h)</h3>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M5 12h14M8 5l4 4 4-4M8 19l4-4 4 4"/></svg>
                </div>
                <div class="card-content" id="tokenUsageChart">
                  <div class="empty-state">Loading...</div>
                </div>
              </div>

              <div class="dashboard-card">
                <div class="card-header">
                  <h3>Quick Actions</h3>
                </div>
                <div class="card-content">
                  <button class="action-btn primary" id="validateButton">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/></svg>
                    Validate Config
                  </button>
                  <button class="action-btn" id="applyButton" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l7 7v7a2 2 0 0 1-2 2z"/><line x1="14" y1="3" x2="14" y2="9"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                    Apply Changes
                  </button>
                </div>
              </div>
            </div>
          </section>

          <!-- Providers View -->
          <section id="view-providers" class="admin-view" data-view="providers" hidden>
            <div class="providers-header">
              <h3>Provider Management</h3>
            </div>
            <div class="provider-grid" id="providerGrid"></div>
            <div class="form-sections" id="providersSections"></div>
          </section>

          <!-- Model Config View -->
          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div class="form-sections" id="modelConfigSections"></div>
          </section>

          <!-- Messaging View -->
          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div class="form-sections" id="messagingSections"></div>
          </section>
        </div>

        <!-- Footer -->
        <footer class="action-bar">
          <div class="config-path" id="configPath"></div>
          <div class="message-area" id="messageArea"></div>
          <div class="action-buttons">
            <button class="btn-secondary" id="validateButton">Validate</button>
            <button class="btn-primary" id="applyButton" disabled>Apply</button>
          </div>
        </footer>
      </main>
    </div>

    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
