---
apiVersion: v1
kind: Namespace
metadata:
  name: file-organizer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-organizer-pro
  namespace: file-organizer
  labels:
    app: file-organizer
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: file-organizer
  template:
    metadata:
      labels:
        app: file-organizer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: file-organizer-pro:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: WORKERS
          value: "4"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: data-mount
          mountPath: /data
      volumes:
      - name: data-mount
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: file-organizer-service
  namespace: file-organizer
  labels:
    app: file-organizer
spec:
  type: ClusterIP
  selector:
    app: file-organizer
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-organizer-hpa
  namespace: file-organizer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-organizer-pro
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: file-organizer-pdb
  namespace: file-organizer
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: file-organizer
