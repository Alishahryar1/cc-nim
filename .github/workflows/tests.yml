# Branch protection: require every status check this workflow reports, for example:
#   Ban suppressions and legacy annotations
#   ruff-format, ruff-check, ty, pytest, playwright
# GitHub may prefix with the workflow name (e.g. "CI / ruff-format"); use the names the branch protection UI offers after a run.

name: CI

env:
  CI_UV_VERSION: "0.11.16"
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"
  UV_CACHE_DIR: /tmp/.uv-cache
  UV_PYTHON_INSTALL_DIR: /tmp/uv-python
  UV_PYTHON_PREFERENCE: only-managed

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-suppressions-or-legacy-annotations:
    name: Ban suppressions and legacy annotations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: "Fail on type ignores and legacy future annotations"
        run: |
          if grep -rE '# type: ignore|# ty: ignore|from __future__ import annotations' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments and legacy future annotations are not allowed. Fix the underlying type/import issue instead."
            exit 1
          fi
          exit 0

  quality:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ruff-format
            run: uv run ruff format --check
          - id: ruff-check
            run: uv run ruff check
          - id: ty
            run: uv run ty check
          - id: pytest
            run: uv run pytest -v --tb=short
          - id: playwright
            run: >-
              uv run pytest e2e -n 0 -v --tb=short
              --tracing=retain-on-failure --screenshot=only-on-failure
              --full-page-screenshot --output=test-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Read Python version
        id: python
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .python-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Python
        id: python-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_PYTHON_INSTALL_DIR }}
          key: uv-python-v1-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.python.outputs.version }}-uv-${{ env.CI_UV_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.CI_UV_VERSION }}
          enable-cache: false

      - name: Install Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: uv python install "${{ steps.python.outputs.version }}"

      - name: Fingerprint dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export \
            --locked \
            --no-emit-workspace \
            --no-header \
            --no-annotate \
            --output-file "$RUNNER_TEMP/uv-ci-dependencies.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/uv-ci-dependencies.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore uv cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-deps-v1-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.python.outputs.version }}-uv-${{ env.CI_UV_VERSION }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            uv-deps-v1-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.python.outputs.version }}-uv-${{ env.CI_UV_VERSION }}-

      - name: Install Chromium
        if: matrix.id == 'playwright'
        run: uv run playwright install --with-deps chromium

      - name: Install the real Terminal Sessions engine
        if: matrix.id == 'playwright'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zellij.tar.gz"
          binary="$RUNNER_TEMP/zellij"
          curl -fsSL \
            "https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-no-web-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          test "$(tar -tzf "$archive")" = "zellij"
          tar -xOzf "$archive" zellij > "$binary"
          test "$(sha256sum "$binary" | cut -d ' ' -f 1)" = \
            "0ec6ef07b63c6355c02ce18343d40ef5ef5af19e25313ea9009c8fceda29e94f"
          chmod 700 "$binary"
          echo "FCC_TEST_ZELLIJ_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run
        run: ${{ matrix.run }}

      - name: Upload Playwright failure artifacts
        if: failure() && matrix.id == 'playwright'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  terminal-pty:
    name: terminal-pty (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: Configure uv paths
        shell: bash
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/.uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"

      - name: Read Python version
        id: python
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .python-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.CI_UV_VERSION }}
          enable-cache: false

      - name: Install Python
        run: uv python install "${{ steps.python.outputs.version }}"

      - name: Install the real Terminal Sessions engine (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64)
              asset="zellij-no-web-x86_64-unknown-linux-musl.tar.gz"
              expected="0ec6ef07b63c6355c02ce18343d40ef5ef5af19e25313ea9009c8fceda29e94f"
              ;;
            Linux:ARM64)
              asset="zellij-no-web-aarch64-unknown-linux-musl.tar.gz"
              expected="2f3965f5b4d7fbb25dfc543e91f9680c9ee7b4eb07d8a3e6392fa276fc65c509"
              ;;
            macOS:X64)
              asset="zellij-no-web-x86_64-apple-darwin.tar.gz"
              expected="ca87de11f346e040be549b8357730143892f005fc66dbe65fe60427673897d30"
              ;;
            macOS:ARM64)
              asset="zellij-no-web-aarch64-apple-darwin.tar.gz"
              expected="ca1d515f6b94435b60504dc1c735a3f7c4273fab92d3c8270e8d4a321e3397c5"
              ;;
            *)
              echo "Unsupported terminal test runner: $RUNNER_OS $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          binary="$RUNNER_TEMP/zellij"
          curl -fsSL \
            "https://github.com/zellij-org/zellij/releases/download/v0.45.1/$asset" \
            -o "$archive"
          test "$(tar -tzf "$archive")" = "zellij"
          tar -xOzf "$archive" zellij > "$binary"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          else
            actual="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          fi
          test "$actual" = "$expected"
          chmod 700 "$binary"
          echo "FCC_TEST_ZELLIJ_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install the real Terminal Sessions engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "zellij.zip"
          $directory = Join-Path $env:RUNNER_TEMP "zellij"
          Invoke-WebRequest `
            -Uri "https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-no-web-x86_64-pc-windows-msvc.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $binary = Join-Path $directory "zellij.exe"
          $actual = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "3d01a2571076885f31a013b3bf1071fd1aba1db2e7b82190c68833737a625346") {
            throw "Zellij checksum mismatch: $actual"
          }
          "FCC_TEST_ZELLIJ_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify native PTY lifecycle
        shell: bash
        run: >-
          uv run --locked
          pytest -o addopts='' tests/runtime/test_terminal_pty.py -v --tb=short
