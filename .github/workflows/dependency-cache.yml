name: Dependency Cache

env:
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"
  UV_CACHE_DIR: /tmp/.uv-cache

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-dependency-cache:
    name: Warm dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Fingerprint dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export \
            --locked \
            --no-emit-workspace \
            --no-header \
            --no-annotate \
            --output-file "$RUNNER_TEMP/uv-ci-dependencies.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/uv-ci-dependencies.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Check for exact uv cache
        id: exact-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-deps-v1-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.setup-python.outputs.python-version }}-uv-${{ steps.setup-uv.outputs.uv-version }}-${{ steps.dependencies.outputs.hash }}
          lookup-only: true

      - name: Restore compatible uv cache
        if: steps.exact-cache.outputs.cache-hit != 'true'
        id: uv-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-deps-v1-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.setup-python.outputs.python-version }}-uv-${{ steps.setup-uv.outputs.uv-version }}-${{ steps.dependencies.outputs.hash }}
          restore-keys: |
            uv-deps-v1-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.setup-python.outputs.python-version }}-uv-${{ steps.setup-uv.outputs.uv-version }}-

      - name: Warm uv cache
        if: steps.exact-cache.outputs.cache-hit != 'true'
        run: uv sync --locked --no-install-workspace

      - name: Save uv cache
        if: steps.exact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
