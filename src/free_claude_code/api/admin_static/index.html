<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code Admin</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FC</div>
          <div>
            <h1>Free Claude Code</h1>
            <p>Server Control</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Admin views"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">Providers</h2>
          </div>
        </header>

        <div id="adminViews" class="admin-views">
          <section id="view-providers" class="admin-view active" data-view="providers">
            <section
              id="connectedAccountsSection"
              class="provider-strip"
              aria-label="Connected accounts"
              hidden
            >
              <div class="strip-header">
                <div>
                  <h3>Connected accounts</h3>
                  <p>Use an existing subscription without storing credentials in .env.</p>
                </div>
              </div>
              <div id="connectedAccountGrid" class="provider-grid"></div>
            </section>
            <section class="provider-strip" aria-label="Provider status">
              <div class="strip-header">
                <h3>Providers</h3>
              </div>
              <div id="providerGrid" class="provider-grid"></div>
            </section>
            <div
              id="providersSections"
              class="form-sections"
              aria-label="Provider configuration"
            ></div>
          </section>

          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div
              id="modelConfigSections"
              class="form-sections"
              aria-label="Model configuration"
            ></div>
          </section>

          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div
              id="messagingSections"
              class="form-sections"
              aria-label="Messaging configuration"
            ></div>
          </section>
        </div>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">No changes</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button id="validateButton" class="secondary-button" type="button">Validate</button>
          <button id="applyButton" class="primary-button" type="button" disabled>Apply</button>
        </div>
      </footer>

      <div id="providerAllowlistModal" class="modal" hidden>
        <div class="modal-backdrop" data-close="providerAllowlistModal"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="providerAllowlistTitle">
          <div class="modal-header">
            <h3 id="providerAllowlistTitle">Select Models</h3>
            <button class="modal-close" data-close="providerAllowlistModal" aria-label="Close">×</button>
          </div>
          <div class="modal-body">
            <div class="model-selector-toolbar">
              <input
                id="providerAllowlistSearch"
                class="model-selector-search"
                type="text"
                placeholder="Search models..."
                autocomplete="off"
              />
              <div class="model-selector-actions">
                <button id="providerAllowlistSelectAll" class="ghost-button" type="button">Select all</button>
                <button id="providerAllowlistSelectFiltered" class="ghost-button" type="button">Select filtered</button>
                <button id="providerAllowlistDeselectAll" class="ghost-button" type="button">Deselect all</button>
              </div>
            </div>
            <div id="providerAllowlistList" class="model-selector-list"></div>
          </div>
          <div class="modal-footer">
            <button id="providerAllowlistCancel" class="secondary-button" type="button">Cancel</button>
            <button id="providerAllowlistSave" class="primary-button" type="button">Save selection</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
