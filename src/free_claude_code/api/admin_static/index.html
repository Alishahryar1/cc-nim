<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code Admin</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
    <link rel="stylesheet" href="/admin/assets/vendor/xterm.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FC</div>
          <div>
            <h1>Free Claude Code</h1>
            <p>Server Control</p>
          </div>
        </div>
        <nav id="sectionNav" class="section-nav" aria-label="Admin views"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">Sessions</h2>
          </div>
        </header>

        <div id="adminViews" class="admin-views">
          <section id="view-sessions" class="admin-view active" data-view="sessions">
            <div id="sessionsMessage" class="sessions-message" role="status"></div>
            <div id="sessionsEmpty" class="sessions-empty">
              <h3>Start a coding session</h3>
              <p>Run Claude Code, Codex, or Pi in any local folder.</p>
              <button id="emptyCreateSessionButton" class="primary-button" type="button">
                Create session
              </button>
            </div>
            <div id="terminalPanel" class="terminal-panel" hidden>
              <div class="terminal-toolbar">
                <div class="terminal-identity">
                  <strong id="sessionName"></strong>
                  <span id="sessionHarness" class="session-badge"></span>
                  <span id="sessionStatus" class="status-pill neutral"></span>
                </div>
                <span id="sessionPath" class="session-path"></span>
              </div>
              <div id="terminalViewport" class="terminal-viewport">
                <div id="terminal"></div>
                <div id="terminalClosed" class="terminal-closed" hidden>
                  <span id="terminalClosedMessage"></span>
                  <button id="restartSessionButton" class="primary-button" type="button">
                    Start again
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section id="view-providers" class="admin-view" data-view="providers" hidden>
            <section
              id="connectedAccountsSection"
              class="provider-strip"
              aria-label="Connected accounts"
              hidden
            >
              <div class="strip-header">
                <div>
                  <h3>Connected accounts</h3>
                  <p>Use an existing subscription without storing credentials in .env.</p>
                </div>
              </div>
              <div id="connectedAccountGrid" class="provider-grid"></div>
            </section>
            <section class="provider-strip" aria-label="Provider status">
              <div class="strip-header">
                <h3>Providers</h3>
              </div>
              <div id="providerGrid" class="provider-grid"></div>
            </section>
            <div
              id="providersSections"
              class="form-sections"
              aria-label="Provider configuration"
            ></div>
          </section>

          <section id="view-model_config" class="admin-view" data-view="model_config" hidden>
            <div
              id="modelConfigSections"
              class="form-sections"
              aria-label="Model configuration"
            ></div>
          </section>

          <section id="view-messaging" class="admin-view" data-view="messaging" hidden>
            <div
              id="messagingSections"
              class="form-sections"
              aria-label="Messaging configuration"
            ></div>
          </section>
        </div>
      </main>

      <footer class="action-bar">
        <div class="action-meta">
          <strong id="dirtyState">No changes</strong>
          <span id="configPath"></span>
        </div>
        <div id="messageArea" class="message-area"></div>
        <div class="action-buttons">
          <button id="validateButton" class="secondary-button" type="button">Validate</button>
          <button id="applyButton" class="primary-button" type="button" disabled>Apply</button>
        </div>
      </footer>
    </div>

    <dialog id="sessionDialog" class="admin-dialog">
      <form id="sessionForm" method="dialog">
        <h3>New session</h3>
        <label for="newSessionPath">Folder</label>
        <input
          id="newSessionPath"
          name="path"
          type="text"
          required
          autocomplete="off"
          placeholder="C:\path\to\project"
        />
        <label for="newSessionHarness">Harness</label>
        <select id="newSessionHarness" name="harness" required></select>
        <p id="harnessHint" class="dialog-hint"></p>
        <label for="newSessionName">Name <span class="optional-label">Optional</span></label>
        <input
          id="newSessionName"
          name="name"
          type="text"
          maxlength="80"
          placeholder="New session"
        />
        <div class="dialog-actions">
          <button class="ghost-button" type="button" data-close-dialog="sessionDialog">Cancel</button>
          <button id="createSessionButton" class="primary-button" type="submit">Create and start</button>
        </div>
      </form>
    </dialog>

    <dialog id="renameDialog" class="admin-dialog">
      <form id="renameForm" method="dialog">
        <h3>Rename session</h3>
        <label for="renameSessionName">Name</label>
        <input id="renameSessionName" name="name" type="text" maxlength="80" required />
        <div class="dialog-actions">
          <button class="ghost-button" type="button" data-close-dialog="renameDialog">Cancel</button>
          <button class="primary-button" type="submit">Rename</button>
        </div>
      </form>
    </dialog>

    <script src="/admin/assets/vendor/xterm.js"></script>
    <script src="/admin/assets/vendor/addon-fit.js"></script>
    <script src="/admin/assets/admin-api.js"></script>
    <script src="/admin/assets/sessions.js"></script>
    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
